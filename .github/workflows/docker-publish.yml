name: Build & Publish Docker images

# Runs on every commit to main, on version tags (v*.*.*), and on manual dispatch.
# Builds linux/amd64 + linux/arm64 images for the Spring Boot backend (/service)
# and the Vue/Nginx frontend (/UI), then publishes both to GitHub Container
# Registry (ghcr.io) using the built-in GITHUB_TOKEN. Version-tag builds are
# additionally published to Docker Hub (needs DOCKERHUB_USERNAME/DOCKERHUB_TOKEN secrets).
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

# One run per ref. Newer pushes to main cancel stale in-flight builds.
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & push (${{ matrix.component.name }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        component:
          # description doubles as the Docker Hub short description — max 100 chars.
          - name: service
            context: ./service
            image: wiremate-service
            description: WireMate backend — management API for WireMock. https://github.com/mixaverros88/WireMate
          - name: ui
            context: ./UI
            image: wiremate-ui
            description: WireMate frontend — web UI for WireMock. https://github.com/mixaverros88/WireMate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR image names must be lowercase. ${{ github.repository_owner }}
      # can be mixed case, so normalise it once and reuse.
      - name: Normalise image name
        id: img
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "ref=${REGISTRY}/${owner}/${{ matrix.component.image }}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (for arm64 emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub publishing only happens for version-tag builds (v*.*.*).
      # Requires the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repo secrets.
      - name: Log in to Docker Hub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ steps.img.outputs.ref }}
            name=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.component.image }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          # Tagging strategy:
          #   - :latest          always points at the newest main build
          #   - :main            rolling tag for the main branch
          #   - :main-<sha>      immutable, traceable reference per commit
          #   - :sha-<sha>       convenience tag for sha-only pins
          #   - :X.Y.Z           semver tag, published when a vX.Y.Z git tag is pushed
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,prefix=main-,format=short,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.title=${{ matrix.component.image }}
            org.opencontainers.image.description=${{ matrix.component.description }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component.context }}
          file: ${{ matrix.component.context }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache via GitHub Actions cache backend — massively speeds
          # up subsequent builds (especially the Maven dependency layer).
          cache-from: type=gha,scope=${{ matrix.component.name }}
          cache-to: type=gha,scope=${{ matrix.component.name }},mode=max

      # Sync the project README to the Docker Hub repo's Overview page.
      # enable-url-completion rewrites relative links/images (docs/logo.svg, …)
      # to absolute raw.githubusercontent.com URLs so they render on Docker Hub.
      - name: Update Docker Hub overview
        if: startsWith(github.ref, 'refs/tags/v')
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.component.image }}
          short-description: ${{ matrix.component.description }}
          readme-filepath: ./README.md
          enable-url-completion: true

      - name: Summary
        run: |
          echo "### Pushed \`${{ matrix.component.image }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Platforms:** linux/amd64, linux/arm64" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Tags:**" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
